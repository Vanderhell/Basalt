name: Bug report
description: Report reproducible incorrect Basalt behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Basalt commit or version
      placeholder: e.g. 66183cb or 1.0.0-rc.4
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Storage provider
      options: [Embedded, SQL Server, Both, Not storage-specific]
    validations:
      required: true
  - type: input
    id: dotnet
    attributes:
      label: .NET version
      placeholder: e.g. .NET 8 or .NET Framework 4.7.2
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: List the smallest reliable steps and include a minimal sample where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error
      description: Remove credentials and sensitive data before pasting output.
      render: text
